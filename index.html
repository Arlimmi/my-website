<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahel Arlimmi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #777;
        }

        .layout {
            max-width: 1100px;
            margin: 0 auto;
            padding: 65px 50px;
            display: grid;
            grid-template-columns: 220px minmax(0, 680px);
            gap: 75px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 55px;
        }

        .sidebar-title {
            margin: 0 0 14px;
            color: #111;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            font-weight: normal;
            line-height: 1.3;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 9px;
        }

        .nav-links a {
            font-size: 14px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            margin-top: 35px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px 7px 14px;
            background: #000;
            color: #fff;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
        }

        .social-btn:hover {
            color: #fff;
            background: #333;
        }

        .social-btn:focus-visible {
            outline: 2px solid #1d9bf0;
            outline-offset: 2px;
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        main {
            padding-top: 0;
        }

        .site-title {
            margin: 0 0 55px;
            color: #111;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.15;
        }

        section {
            margin-bottom: 65px;
            scroll-margin-top: 30px;
        }

        section h2 {
            margin: 0 0 22px;
            color: #111;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 23px;
            font-weight: normal;
        }

        .entry {
            margin-bottom: 25px;
        }

        .entry-date {
            display: block;
            margin-bottom: 3px;
            color: #888;
            font-size: 12px;
        }

        .entry-title {
            color: #222;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
        }

        .entry-description {
            margin: 3px 0 0;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .layout {
                display: block;
                padding: 35px 24px 55px;
            }

            .sidebar {
                position: static;
                margin-bottom: 55px;
            }

            .nav-links {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px 18px;
            }

            .social-links {
                margin-top: 22px;
            }

            .site-title {
                font-size: 32px;
                margin-bottom: 40px;
            }

            section {
                margin-bottom: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <h2 class="sidebar-title">Directory:</h2>

            <nav class="nav-links">
                <a href="#projects">Projects</a>
                <a href="#journey">My Journey</a>
                <a href="#reflections">Fun &amp; Reflections</a>
            </nav>

            <div class="social-links">
                <a class="social-btn"
                   href="https://x.com/sahelarlimmi"
                   target="_blank"
                   rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    Follow @sahelarlimmi
                </a>

                <a class="social-btn"
                   href="https://github.com/Arlimmi"
                   target="_blank"
                   rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
                    </svg>
                    Follow @Arlimmi
                </a>
            </div>

        </aside>

        <main>

            <h1 class="site-title">Sahel Arlimmi</h1>

            <section id="projects">
                <h2>Projects</h2>

                <!-- Add your projects here -->

            </section>

            <section id="journey">
                <h2>My Journey</h2>

                <!-- Add your journey entries here -->

            </section>

            <section id="reflections">
                <h2>Fun &amp; Reflections</h2>

                <!-- Add your reflections here -->

            </section>

        </main>

    </div>

</body>
</html>
