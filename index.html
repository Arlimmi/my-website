
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sahel Arlimmi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .layout {
            max-width: 1100px;
            margin: 0 auto;
            padding: 65px 50px;
            display: grid;
            grid-template-columns: 220px minmax(0, 680px);
            gap: 75px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 55px;
        }

        .site-title {
            margin: 0 0 28px;
            color: #111;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.15;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 9px;
        }

        .nav-links a {
            color: #555;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #000;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }

        .social-links a {
            color: #777;
            font-size: 14px;
        }

        .social-links a:hover {
            color: #000;
        }

        main {
            padding-top: 5px;
        }

        section {
            margin-bottom: 65px;
            scroll-margin-top: 30px;
        }

        section h2 {
            margin: 0 0 22px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 23px;
            font-weight: normal;
            color: #111;
        }

        .post {
            margin-bottom: 25px;
        }

        .post-date {
            display: block;
            margin-bottom: 3px;
            color: #999;
            font-size: 13px;
        }

        .post-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            color: #222;
        }

        .post-description {
            margin: 4px 0 0;
            color: #666;
            font-size: 14px;
        }

        footer {
            margin-top: 90px;
            color: #aaa;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .layout {
                display: block;
                padding: 35px 24px 55px;
            }

            .sidebar {
                position: static;
                margin-bottom: 65px;
            }

            .site-title {
                font-size: 33px;
            }

            .nav-links {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px 20px;
            }

            .social-links {
                margin-top: 22px;
            }

            section {
                margin-bottom: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <h1 class="site-title">Sahel Arlimmi</h1>

            <nav class="nav-links">
                <a href="#projects">Projects</a>
                <a href="#journey">My Journey</a>
                <a href="#reflections">Fun &amp; Reflections</a>
            </nav>

            <div class="social-links">
                <a href="https://x.com/sahelarlimmi"
                   target="_blank"
                   rel="noopener noreferrer">Twitter</a>

                <a href="https://github.com/Arlimmi"
                   target="_blank"
                   rel="noopener noreferrer">GitHub</a>
            </div>

        </aside>

        <main>

            <section id="projects">
                <h2>Projects</h2>

                <!-- Add your projects here -->

            </section>

            <section id="journey">
                <h2>My Journey</h2>

                <!-- Add your journey entries here -->

            </section>

            <section id="reflections">
                <h2>Fun &amp; Reflections</h2>

                <!-- Add your reflections here -->

            </section>

            <footer>
                © 2026 Sahel Arlimmi
            </footer>

        </main>

    </div>

</body>
</html>
